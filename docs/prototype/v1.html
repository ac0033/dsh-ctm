}</dd></dl>${s.previous?`<h3>为什么在这里</h3><p class="small">${esc(s.previous)}</p>`:'<h3>为什么在这里</h3><p class="small">这条记录尚未被替换或压缩，仍包含在所选范围推导的上下文中。</p>'}<h3>内容提示</h3><p class="small muted">未检测到明确重复。此提示基于文本规则，不代表模型实际采纳了这段内容。</p>${range==='live'&&['user','system','assistant'].includes(s.role)?'<button class="outline full" id="edit">编辑并预览</button>':''}${range!=='live'?'<button class="primary full" id="fork">从此轮次分叉</button>':''}<button class="full" id="copy">复制文本</button><details><summary>请求与用量详情</summary><p>累计输入：68.4k<br>缓存命中：42.1k<br>输出：8.2k</p><p class="muted">示例统计，区别于当前上下文占用。工具定义属于请求配置，单独检查。</p></details><details><summary>高级操作</summary><p class="muted">旧回退与恢复将保留在这里。恢复可能改变角色与顺序，优先使用分叉。</p></details>`}$('detail').innerHTML=html;
if($('edit'))$('edit').onclick=()=>{mode='edit';detail()};if($('preview'))$('preview').onclick=()=>{draft=$('draft').value;mode='preview';detail()};if($('back'))$('back').onclick=()=>{mode='detail';detail()};if($('apply'))$('apply').onclick=()=>{queued.push({label:s.label,text:draft});$('queueCount').textContent=queued.length;mode='queue';detail();message('已加入模拟队列；真实会话没有变化。')};if($('copy'))$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(s.text);message('文本已复制')}catch{message('浏览器未允许复制，请选中文本手动复制')}};if($('fork'))$('fork').onclick=()=>$('forkDialog').showModal();if($('clearQueue'))$('clearQueue').onclick=()=>{queued=[];$('queueCount').textContent=0;detail()}}
$('turns').innerHTML=titles.map((t,i)=>`<button data-turn="${i+1}"><span class="num">${String(i+1).padStart(2,'0')}</span>${t}</button>`).join('');$('mobileTurns').innerHTML='<option value="live">当前上下文</option>'+titles.map((t,i)=>`<option value="${i+1}">${i+1} · ${t}</option>`).join('');document.querySelectorAll('[data-turn]').forEach(b=>b.onclick=()=>selectRange(b.dataset.turn));$('mobileTurns').onchange=e=>selectRange(e.target.value);$('search').oninput=render;$('filter').onchange=render;$('theme').onclick=()=>{dark=!dark;document.body.toggleAttribute('data-ds-dark-theme',dark);document.documentElement.style.colorScheme=dark?'dark':'light'};$('close').onclick=()=>$('inspector').classList.remove('open');$('queue').onclick=()=>{mode='queue';$('inspector').classList.add('open');detail()};$('cancelFork').onclick=()=>$('forkDialog').close();$('confirmFork').onclick=()=>{$('forkDialog').close();message(`已模拟从第 ${range} 轮分叉，输入保留为草稿；没有创建真实会话。`)};render();
</script></body></html>
